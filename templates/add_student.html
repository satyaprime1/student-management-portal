{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <h2>Add Student</h2>

    <form method="POST">

        <div class="mb-3">
            <label>Name</label>
            <input 
                type="text" 
                name="name" 
                class="form-control">
        </div>


        <div class="mb-3">
            <label>Age</label>
            <input 
                type="number" 
                name="age" 
                class="form-control">
        </div>


        <div class="mb-3">
            <label>Branch</label>
            <input 
                type="text" 
                name="branch" 
                class="form-control">
        </div>


        <div class="mb-3">
            <label>Email</label>
            <input 
                type="email" 
                name="email" 
                class="form-control">
        </div>


        <button class="btn btn-primary">
            Add Student
        </button>

    </form>

</div>


{% endblock %}
